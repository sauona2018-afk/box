<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #box {
            height: 300px;
            width: 300px;
            background-color: rgb(192, 192, 201);
            color: white;
            font-size: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media screen and (min-width: 720px) {
            #box {
                background-color: rgb(58, 134, 134);
                border-radius: 25%;
                font-size: 0;
            }

            #box::after {
                content: "hello";
                font-size: 60px;
            }
        }

        @media screen and (min-width: 1024px) {
            #box {
                background-color: goldenrod;
                border-radius: 50%;
            }

            #box::after {
                content: "how are you?";
                max-width: 80%;
                font-size: 28px;
                line-height: 1.2;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div id="box">hii</div>
    
</body>
</html>
